<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="background" x1="0" y1="0" x2="1200" y2="430">
    <stop offset="0%" stop-color="#020611"/>
    <stop offset="50%" stop-color="#07101F"/>
    <stop offset="100%" stop-color="#020611"/>
  </linearGradient>

  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00FFFF"/>
    <stop offset="50%" stop-color="#7C4DFF"/>
    <stop offset="100%" stop-color="#00FFFF"/>
  </linearGradient>

  <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00FFFF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00FFFF" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#00FFFF" stop-opacity="0"/>
  </linearGradient>

  <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="purpleGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path
      d="M 30 0 L 0 0 0 30"
      fill="none"
      stroke="#14233A"
      stroke-width="1"
    />
  </pattern>

</defs>


<!-- FUNDO -->

<rect
  width="1200"
  height="430"
  rx="22"
  fill="url(#background)"
/>

<rect
  x="8"
  y="8"

<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390">
      <stop offset="0%" stop-color="#020611"/>
      <stop offset="50%" stop-color="#07101F"/>
      <stop offset="100%" stop-color="#020611"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00F7FF"/>
    </linearGradient>

    <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#12233A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <rect x="10" y="10" width="1180" height="370" rx="20" stroke="#17365B" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="342" rx="16" fill="url(#grid)" opacity="0.18"/>

  <rect x="36" y="34" width="1128" height="5" rx="3" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>

  <text x="52" y="74" fill="#00F7FF" font-family="monospace" font-size="19" font-weight="700">PROFILE SCAN</text>
  <text x="1144" y="74" text-anchor="end" fill="#7C97BC" font-family="monospace" font-size="13">IDENTITY // BACKEND // AI</text>

  <text x="88" y="150" fill="#FFFFFF" font-family="monospace" font-size="50" font-weight="700">DANIEL MARQUES</text>
  <text x="88" y="184" fill="#9AB0D0" font-family="monospace" font-size="21">BACKEND DEVELOPER // SOFTWARE ENGINEERING STUDENT</text>

  <rect x="88" y="210" width="170" height="36" rx="18" fill="#07101D" stroke="#00F7FF"/>
  <text x="173" y="233" text-anchor="middle" fill="#00F7FF" font-family="monospace" font-size="14" font-weight="700">OPEN_TO_WORK</text>

  <rect x="274" y="210" width="115" height="36" rx="18" fill="#07101D" stroke="#7C4DFF"/>
  <text x="331.5" y="233" text-anchor="middle" fill="#C6B5FF" font-family="monospace" font-size="14" font-weight="700">PYTHON</text>

  <rect x="402" y="210" width="98" height="36" rx="18" fill="#07101D" stroke="#00F7FF"/>
  <text x="451" y="233" text-anchor="middle" fill="#00F7FF" font-family="monospace" font-size="14" font-weight="700">JAVA</text>

  <rect x="513" y="210" width="120" height="36" rx="18" fill="#07101D" stroke="#7C4DFF"/>
  <text x="573" y="233" text-anchor="middle" fill="#C6B5FF" font-family="monospace" font-size="14" font-weight="700">FASTAPI</text>

  <rect x="646" y="210" width="155" height="36" rx="18" fill="#07101D" stroke="#00F7FF"/>
  <text x="723.5" y="233" text-anchor="middle" fill="#00F7FF" font-family="monospace" font-size="14" font-weight="700">SPRING BOOT</text>

  <rect x="816" y="210" width="95" height="36" rx="18" fill="#07101D" stroke="#7C4DFF"/>
  <text x="863.5" y="233" text-anchor="middle" fill="#C6B5FF" font-family="monospace" font-size="14" font-weight="700">LLMs</text>

  <rect x="925" y="210" width="125" height="36" rx="18" fill="#07101D" stroke="#00F7FF"/>
  <text x="987.5" y="233" text-anchor="middle" fill="#00F7FF" font-family="monospace" font-size="14" font-weight="700">AI AGENTS</text>

  <rect x="88" y="270" width="1018" height="58" rx="16" fill="#071222" stroke="#17395E"/>
  <text x="110" y="293" fill="#6E89AF" font-family="monospace" font-size="13">CURRENT FOCUS</text>
  <text x="110" y="314" fill="#FFFFFF" font-family="monospace" font-size="16">Backend • APIs • Automation • Artificial Intelligence • LLMs • MCP • Tool Calling</text>

  <rect x="50" y="104" width="1090" height="34" fill="url(#scanGradient)" opacity="0.8">
    <animate attributeName="y" values="104;300;104" dur="3.3s" repeatCount="indefinite"/>
  </rect>

  <rect x="50" y="120" width="1090" height="2" fill="#00F7FF" filter="url(#glow)">
    <animate attributeName="y" values="120;316;120" dur="3.3s" repeatCount="indefinite"/>
  </rect>

  <text x="52" y="350" fill="#00F7FF" font-family="monospace" font-size="14">
    &gt; scanning_profile...
    <animate attributeName="opacity" values="1;0.35;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <text x="1144" y="350" text-anchor="end" fill="#7C4DFF" font-family="monospace" font-size="14">SYSTEM_READY</text>
</svg>
